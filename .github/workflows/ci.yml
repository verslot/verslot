name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install commitlint
        run: >-
          npm install --no-save --no-package-lock --ignore-scripts
          @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Lint pull request commits
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          ./node_modules/.bin/commitlint --config .github/commitlint.config.json
          --from "$PR_BASE_SHA" --to "$PR_HEAD_SHA" --git-log-args=--no-merges

  release-draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test draft Release preparation
        shell: pwsh
        run: .github/scripts/test-release-draft.ps1

  fmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show

      - name: Check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

  terminal-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Native PTY and redirected installation progress
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -B -m unittest discover -s .github/scripts -p test_terminal_progress.py
          python .github/scripts/check_terminal_progress.py

      - name: Preserve native terminal acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-acceptance-${{ matrix.os }}
          path: target/terminal-acceptance/
          if-no-files-found: error
