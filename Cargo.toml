[package]
name = "verslot"
version = "0.1.0"
edition = "2024"
description = "A minimal, extensible tool version manager written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/verslot/verslot"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
