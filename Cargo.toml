[package]
name = "verslot"
version = "0.7.1"
edition = "2024"
description = "A minimal, extensible tool version manager written in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/verslot/verslot"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
indicatif = { version = "0.18", default-features = false }
sha2 = { version = "0.11", default-features = false }
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.5.2", default-features = false }
junction = "2"
winapi-util = "=0.1.11"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
